[workspace]
exclude = ["third_party/smithay", "third_party/gpui"]
members = [
    "clarion-core",
    "clarion-motion",
    "clarion-timing",
    "clarion-scene",
    "clarion-config",
    "clarion-ipc",
    "clarion-visual-tests",
    "clarion-settings",
    "clarion-launcher",
]

[workspace.package]
version = "0.1.0"
description = "A Rust Wayland compositor with native Vulkan composition, HDR10/scRGB color management and an independent desktop core"
authors = ["Clarion Contributors", "Realand Contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
repository = "https://github.com/123llyrr/clarion"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.104"
bitflags = "2.13.1"
clap = { version = "4.6.6", features = ["derive"] }
insta = "1.48.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.18.4", default-features = false }

[workspace.dependencies.smithay]
# version = "0.4.1"
git = "https://github.com/Smithay/smithay.git"
rev = "4cf0b62028039661477d482ec4758b687d8f4392"
default-features = false

[workspace.dependencies.smithay-drm-extras]
# version = "0.1.0"
git = "https://github.com/Smithay/smithay.git"
rev = "4cf0b62028039661477d482ec4758b687d8f4392"
# path = "../smithay/smithay-drm-extras"

[package]
name = "clarion"
version.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

readme = "README.md"
keywords = ["wayland", "compositor", "vulkan", "desktop", "tiling"]

[dependencies]
accesskit = { version = "0.24", optional = true }
accesskit_unix = { version = "0.22", optional = true }
anyhow.workspace = true
arrayvec = "0.7.8"
ash = { version = "0.38.0", default-features = false, features = ["std", "libloading"] }
async-channel = "2.5.0"
async-io = { version = "2.6.0", optional = true }
atomic = "0.6.1"
bitflags.workspace = true
bytemuck = { version = "1.25.2", features = ["derive"] }
calloop = { version = "0.14.4", features = ["executor", "futures-io", "signals"] }
clap = { workspace = true, features = ["string"] }
clap_complete = "4.6.9"
clap_complete_nushell = "4.6.1"
directories = "6.0.0"
drm-ffi = "0.9.1"
fastrand = "2.5.0"
futures-util = { version = "0.3.33", default-features = false, features = ["std", "io"] }
git-version = "0.3.9"
glam = "0.33"
input = { version = "0.10.0", features = ["libinput_1_21"] }
keyframe = { version = "1.1.1", default-features = false }
libc = "0.2.189"
libdisplay-info = "0.3.0"
log = { version = "0.4.33", features = ["max_level_trace", "release_max_level_debug"] }
clarion-config = { version = "0.1.0", path = "clarion-config" }
clarion-core = { version = "0.1.0", path = "clarion-core" }
clarion-motion = { version = "0.1.0", path = "clarion-motion" }
clarion-timing = { version = "0.1.0", path = "clarion-timing" }
clarion-scene = { version = "0.1.0", path = "clarion-scene" }
clarion-ipc = { version = "0.1.0", path = "clarion-ipc", features = ["clap"] }
ordered-float = "5.3.0"
pango = { version = "0.21.5", features = ["v1_44"] }
pangocairo = "0.21.5"
pipewire = { version = "0.10.0", optional = true, features = ["v0_3_33"] }
png = "0.18.1"
portable-atomic = "1"
profiling = "1.0.18"
sd-notify = "0.5.0"
serde.workspace = true
serde_json.workspace = true
smallvec = "1.15.2"
smithay-drm-extras.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
tracy-client.workspace = true
wayland-backend = "0.3.16"
wayland-scanner = "0.31.11"
wayland-server = "0.31.14"
xcursor = "0.3.11"
zbus = { version = "5.18.0", optional = true }

[dependencies.smithay]
workspace = true
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_vulkan",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "renderer_multi",
    "use_system_lib",
    "wayland_frontend",
]

[dev-dependencies]
approx = "0.5.1"
calloop-wayland-source = "0.4.1"
insta.workspace = true
proptest = "1.11.0"
proptest-derive = { version = "0.8.0", features = ["boxed_union"] }
rayon = "1.12.0"
wayland-client = "0.31.15"
xshell = "0.2.7"

[build-dependencies]
pkg-config = "0.3.33"

[features]
default = ["dbus", "systemd", "xdp-gnome-screencast"]
# Enables D-Bus support (serve various freedesktop and GNOME interfaces, accessibility tree, power button handling).
dbus = ["dep:zbus", "dep:async-io", "dep:accesskit", "dep:accesskit_unix"]
# Enables systemd integration (global environment, apps in transient scopes).
systemd = ["dbus"]
# Enables screencasting support through xdg-desktop-portal-gnome.
xdp-gnome-screencast = ["dbus", "pipewire"]
# Enables the Tracy profiler instrumentation.
profile-with-tracy = ["profiling/profile-with-tracy", "tracy-client/default", "smithay/tracy_gpu_profiling"]
# Enables the on-demand Tracy profiler instrumentation.
profile-with-tracy-ondemand = ["profile-with-tracy", "tracy-client/ondemand", "tracy-client/manual-lifetime"]
# Enables Tracy allocation profiling.
profile-with-tracy-allocations = ["profile-with-tracy"]
# Enables dinit integration (global environment).
dinit = []

[lints.clippy]
new_without_default = "allow"
collapsible_match = "allow"

[profile.release]
debug = "line-tables-only"
overflow-checks = true
lto = "thin"

[profile.release.package.clarion-config]
# knuffel with chomsky generates a metric ton of debuginfo.
debug = false

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[package.metadata.generate-rpm]
version = "0.1.0"
assets = [
    { source = "target/release/clarion", dest = "/usr/bin/", mode = "755" },
    { source = "target/release/clarion-settings", dest = "/usr/bin/", mode = "755" },
    { source = "target/release/clarion-launcher", dest = "/usr/bin/", mode = "755" },
    { source = "resources/clarion-session", dest = "/usr/bin/", mode = "755" },
    { source = "resources/clarion.desktop", dest = "/usr/share/wayland-sessions/", mode = "644" },
    { source = "resources/clarion-portals.conf", dest = "/usr/share/xdg-desktop-portal/", mode = "644" },
    { source = "resources/clarion.service", dest = "/usr/lib/systemd/user/", mode = "644" },
    { source = "resources/clarion-shutdown.target", dest = "/usr/lib/systemd/user/", mode = "644" },
    { source = "resources/compat/realand", dest = "/usr/bin/realand", mode = "755" },
    { source = "resources/compat/realand-session", dest = "/usr/bin/realand-session", mode = "755" },
    { source = "resources/compat/realand-settings", dest = "/usr/bin/realand-settings", mode = "755" },
    { source = "resources/clarion-shell-msg", dest = "/usr/bin/clarion-shell-msg", mode = "755" },
    { source = "resources/compat/realand-shell-msg", dest = "/usr/bin/realand-shell-msg", mode = "755" },
]
[package.metadata.generate-rpm.requires]
alacritty = "*"
fuzzel = "*"
python3 = "*"

[package.metadata.deb]
depends = "alacritty, fuzzel, python3"
assets = [
    ["target/release/clarion", "usr/bin/", "755"],
    ["target/release/clarion-settings", "usr/bin/", "755"],
    ["target/release/clarion-launcher", "usr/bin/", "755"],
    ["resources/clarion-session", "usr/bin/", "755"],
    ["resources/clarion.desktop", "/usr/share/wayland-sessions/", "644"],
    ["resources/clarion-portals.conf", "/usr/share/xdg-desktop-portal/", "644"],
    ["resources/clarion.service", "/usr/lib/systemd/user/", "644"],
    ["resources/clarion-shutdown.target", "/usr/lib/systemd/user/", "644"],
    ["resources/compat/realand", "usr/bin/realand", "755"],
    ["resources/compat/realand-session", "usr/bin/realand-session", "755"],
    ["resources/compat/realand-settings", "usr/bin/realand-settings", "755"],
    ["resources/clarion-shell-msg", "usr/bin/clarion-shell-msg", "755"],
    ["resources/compat/realand-shell-msg", "usr/bin/realand-shell-msg", "755"],
]

# Keep the compositor damage/occlusion fix reproducible across machines.
[patch."https://github.com/Smithay/smithay.git"]
smithay = { path = "third_party/smithay" }

[patch.crates-io]
gpui = { path = "third_party/gpui" }
