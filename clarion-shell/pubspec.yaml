name: clarion_shell
description: Clarion's independent Wayland shell with Material and macOS layouts.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.6'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dbus: ^0.7.14
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/macos/
  fonts:
    - family: macOSSystem
      fonts:
        - asset: assets/macos/SFNS.ttf
    - family: macOSChinese
      fonts:
        - asset: assets/macos/PingFangSC-Regular.otf
          weight: 400
        - asset: assets/macos/PingFangSC-Semibold.otf
          weight: 600
