name: clarion_shell
description: Clarion's independent Wayland shell with Material and macOS layouts.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.6'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dbus: ^0.7.14
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  # The icon set ships with the repository. The imported shell artwork and
  # fonts stay out of the distribution tree: scripts/import-shell-assets.sh
  # restores them from an image you own, adds - assets/shell/ to the list and
  # uncomments the fonts between the markers below.
  assets:
    - assets/icons/
  # BEGIN shell assets
  # fonts:
  #   - family: ClarionSystem
  #     fonts:
  #       - asset: assets/shell/ui-text.ttf
  #   - family: ClarionChinese
  #     fonts:
  #       - asset: assets/shell/cjk-regular.otf
  #         weight: 400
  #       - asset: assets/shell/cjk-semibold.otf
  #         weight: 600
  # END shell assets
